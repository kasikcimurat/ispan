<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Spanish Quiz</title>
<link rel="icon" href="logo.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0608;
  --card: #160a0c;
  --card2: #1e0e10;
  --red: #e8341a;
  --red-soft: #ff5c3d;
  --gold: #f5a623;
  --gold-soft: #ffc04d;
  --text: #fff5f0;
  --muted: #8a5a5a;
  --correct: #3de8a0;
  --wrong: #ff4f6e;
  --border: rgba(232,52,26,0.12);
  --border-strong: rgba(232,52,26,0.38);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px 60px;
  position: relative;
  overflow-x: hidden;
}

/* ── Background ── */
.bg-grid {
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(232,52,26,0.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(232,52,26,0.035) 1px,transparent 1px);
  background-size:40px 40px; pointer-events:none;
}
.blob { position:fixed; border-radius:50%; filter:blur(90px); pointer-events:none; animation:drift 14s ease-in-out infinite alternate; }
.blob1 { width:500px;height:500px;background:#6e0a00;top:-200px;left:-160px;opacity:0.25; }
.blob2 { width:400px;height:400px;background:#3a0400;bottom:-160px;right:-100px;opacity:0.3;animation-delay:5s; }
.blob3 { width:280px;height:280px;background:#f5a623;top:40%;left:58%;opacity:0.04;animation-delay:9s; }
@keyframes drift { 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(25px,18px) scale(1.07);} }

/* ── Header ── */
.header { display:flex; flex-direction:column; align-items:center; margin-bottom:22px; margin-top:8px; position:relative; z-index:1; }
.logo-ring {
  width:70px; height:70px; border-radius:50%;
  background:linear-gradient(145deg,#e8341a,#c0200a);
  display:flex; align-items:center; justify-content:center;
  margin-bottom:12px;
  box-shadow:0 0 36px rgba(232,52,26,0.45), 0 4px 20px rgba(0,0,0,0.6);
  position:relative;
}
.logo-ring::after { content:''; position:absolute; inset:4px; border-radius:50%; background:var(--bg); }
.logo-inner { position:relative; z-index:1; display:flex; align-items:center; justify-content:center; width:46px; height:46px; }
.logo-flag { font-size:28px; line-height:1; }
.header h1 { font-family:'Barlow Condensed',sans-serif; font-size:clamp(26px,6vw,42px); font-weight:800; color:var(--text); letter-spacing:0.5px; line-height:1; text-align:center; }
.header h1 .accent { color:var(--red); text-shadow:0 0 24px rgba(232,52,26,0.5); }
.header h1 .gold { color:var(--gold); text-shadow:0 0 18px rgba(245,166,35,0.4); }
.header p { color:var(--muted); font-size:13px; margin-top:7px; font-weight:600; letter-spacing:0.4px; }

/* ── Level Selector ── */
.level-selector {
  display:flex; gap:8px; margin-bottom:18px; position:relative; z-index:1;
  width:100%; max-width:560px; flex-wrap:wrap;
}
.level-btn {
  flex:1; min-width:100px;
  padding:12px 10px; border-radius:14px;
  font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700;
  cursor:pointer; border:2px solid transparent; transition:all 0.2s ease;
  letter-spacing:0.4px; text-align:center; line-height:1.3; white-space:nowrap;
}
.level-btn.kelimeler {
  background:rgba(232,52,26,0.08);
  border-color:rgba(232,52,26,0.25);
  color:rgba(232,100,70,0.75);
}
.level-btn.kelimeler.active,
.level-btn.kelimeler:hover {
  background:rgba(232,52,26,0.2);
  border-color:var(--red);
  color:var(--red-soft);
  box-shadow:0 0 20px rgba(232,52,26,0.3);
}

/* ── Stats ── */
.stats { display:flex; gap:10px; margin-bottom:14px; position:relative; z-index:1; width:100%; max-width:560px; }
.stat { flex:1; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:12px 8px; text-align:center; }
.stat-num { font-family:'Barlow Condensed',sans-serif; font-size:28px; font-weight:800; line-height:1; }
.stat-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.8px; margin-top:3px; font-weight:700; }
.stat:nth-child(1) .stat-num { color:var(--correct); }
.stat:nth-child(2) .stat-num { color:var(--wrong); }
.stat:nth-child(3) .stat-num { color:var(--gold); }

/* ── Goal Widget ── */
.goal-wrap { width:100%; max-width:560px; position:relative; z-index:1; margin-bottom:14px; }
.goal-collapsed { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:12px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; transition:border-color 0.2s; }
.goal-collapsed:hover { border-color:var(--border-strong); }
.goal-circle-mini { position:relative; flex-shrink:0; width:48px; height:48px; }
.goal-circle-mini svg { transform:rotate(-90deg); }
.goal-circle-mini .gtrack { fill:none; stroke:rgba(232,52,26,0.12); stroke-width:4; }
.goal-circle-mini .gfill  { fill:none; stroke:var(--red); stroke-width:4; stroke-linecap:round; transition:stroke-dashoffset 0.6s ease; }
.mini-pct-label { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:800; color:var(--red-soft); }
.goal-info { flex:1; }
.goal-info-title { font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700; color:var(--text); letter-spacing:0.3px; }
.goal-info-sub { font-size:12px; color:var(--muted); font-weight:600; margin-top:2px; }
.goal-set-btn { background:rgba(232,52,26,0.1); border:1px solid rgba(232,52,26,0.35); border-radius:10px; padding:6px 12px; font-family:'Nunito',sans-serif; font-size:12px; font-weight:800; color:var(--red-soft); cursor:pointer; transition:all 0.15s; white-space:nowrap; }
.goal-set-btn:hover { background:rgba(232,52,26,0.22); }
.goal-panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px; display:none; }
.goal-panel.open { display:block; }
.goal-panel-top { display:flex; align-items:center; gap:16px; margin-bottom:16px; }
.goal-big-circle { position:relative; flex-shrink:0; width:90px; height:90px; }
.goal-big-circle svg { transform:rotate(-90deg); }
.goal-big-circle .gtrack { fill:none; stroke:rgba(232,52,26,0.1); stroke-width:7; }
.goal-big-circle .gfill  { fill:none; stroke:var(--red); stroke-width:7; stroke-linecap:round; transition:stroke-dashoffset 0.6s ease; }
.big-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.big-num { font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:800; color:var(--red-soft); line-height:1; }
.big-sub { font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
.goal-panel-info { flex:1; }
.goal-done-txt { font-family:'Barlow Condensed',sans-serif; font-size:28px; font-weight:800; color:var(--text); line-height:1; }
.goal-done-sub { font-size:12px; color:var(--muted); font-weight:600; margin-top:4px; margin-bottom:12px; }
.goal-presets { display:flex; gap:6px; flex-wrap:wrap; }
.goal-preset-btn { background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:6px 12px; font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:700; color:var(--muted); cursor:pointer; transition:all 0.15s; }
.goal-preset-btn:hover, .goal-preset-btn.sel { background:rgba(232,52,26,0.14); border-color:rgba(232,52,26,0.45); color:var(--red-soft); }
.goal-custom-row { display:flex; gap:8px; margin-top:10px; align-items:center; }
.goal-custom-input { flex:1; padding:8px 12px; background:var(--card2); border:1px solid var(--border); border-radius:10px; font-family:'Nunito',sans-serif; font-size:14px; font-weight:700; color:var(--text); outline:none; transition:border-color 0.18s; }
.goal-custom-input:focus { border-color:rgba(232,52,26,0.5); }
.goal-apply-btn { padding:8px 14px; background:rgba(232,52,26,0.15); border:1px solid rgba(232,52,26,0.45); border-radius:10px; font-family:'Nunito',sans-serif; font-size:13px; font-weight:800; color:var(--red-soft); cursor:pointer; transition:all 0.15s; white-space:nowrap; }
.goal-apply-btn:hover { background:rgba(232,52,26,0.28); }
.goal-close-btn { width:100%; margin-top:14px; padding:9px; background:transparent; border:1px solid var(--border); border-radius:10px; font-family:'Nunito',sans-serif; font-size:13px; font-weight:700; color:var(--muted); cursor:pointer; transition:all 0.15s; }
.goal-close-btn:hover { color:var(--text); border-color:var(--border-strong); }
.goal-complete-banner { background:linear-gradient(135deg,rgba(61,232,160,0.15),rgba(61,232,160,0.05)); border:1px solid rgba(61,232,160,0.35); border-radius:12px; padding:10px 16px; font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:700; color:var(--correct); text-align:center; margin-top:12px; animation:popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275); }

/* ── Streak ── */
.streak-wrap { position:relative; z-index:1; margin-bottom:12px; min-height:28px; display:flex; align-items:center; justify-content:center; }
.streak-badge { background:linear-gradient(135deg,rgba(232,52,26,0.2),rgba(232,52,26,0.08)); border:1px solid rgba(232,52,26,0.45); border-radius:20px; padding:4px 16px; font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:700; color:var(--red-soft); letter-spacing:0.5px; display:flex; align-items:center; gap:6px; animation:popIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275); }
@keyframes popIn { 0%{transform:scale(0.6);opacity:0;} 100%{transform:scale(1);opacity:1;} }

/* ── Card ── */
.card {
  background:var(--card); border:1px solid var(--border); border-radius:26px;
  padding:28px 22px 22px; max-width:560px; width:100%; position:relative;
  z-index:1; box-shadow:0 20px 60px rgba(0,0,0,0.6), 0 1px 0 rgba(232,52,26,0.08) inset;
}
.card::before { content:''; position:absolute; top:0; left:24px; right:24px; height:3px; background:linear-gradient(90deg,transparent,var(--red),var(--gold),var(--red),transparent); border-radius:0 0 4px 4px; }

/* ── Badge row ── */
.badge-row { display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.dir-badge { display:inline-flex; align-items:center; gap:7px; background:var(--card2); border:1px solid var(--border); border-radius:20px; padding:6px 14px; font-size:12px; color:var(--muted); font-weight:700; letter-spacing:0.3px; }
.dir-badge .dot { width:7px; height:7px; border-radius:50%; background:var(--red); box-shadow:0 0 6px var(--red); }
.lvl-badge { display:inline-flex; align-items:center; border-radius:20px; padding:6px 14px; font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; }
.lvl-badge.kelimeler-a { background:rgba(232,52,26,0.14); border:1px solid rgba(232,52,26,0.45); color:var(--red-soft); }
.lvl-badge.kelimeler-b { background:rgba(245,166,35,0.12); border:1px solid rgba(245,166,35,0.4); color:var(--gold-soft); }

/* ── Question Box ── */
.question-box {
  border-radius:18px; padding:26px 20px; text-align:center; margin-bottom:18px;
  min-height:120px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  position:relative; overflow:hidden; transition:border-color 0.3s;
  background:linear-gradient(145deg,var(--card2),rgba(232,52,26,0.06));
  border:1px solid var(--border-strong);
}
.question-box::after {
  content:'ES'; position:absolute; right:-4px; bottom:-16px;
  font-family:'Barlow Condensed',sans-serif; font-size:100px; font-weight:900;
  color:rgba(232,52,26,0.045); letter-spacing:-2px; line-height:1; pointer-events:none;
}
.question-box.level-b::after { content:'ES'; color:rgba(245,166,35,0.045); }
.question-box.level-b { background:linear-gradient(145deg,var(--card2),rgba(245,166,35,0.05)); border-color:rgba(245,166,35,0.35); }

.question-label { font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:11px; font-weight:700; }
.question-word { font-family:'Nunito',sans-serif; font-size:clamp(18px,4.5vw,26px); font-weight:900; color:var(--text); line-height:1.5; position:relative; z-index:1; }
.question-hint { font-size:13px; color:var(--correct); margin-top:10px; font-weight:700; line-height:1.45; }

/* ── Options ── */
.options { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
.option-btn {
  background:var(--card2); border:2px solid rgba(232,52,26,0.08); border-radius:14px;
  padding:13px 11px; color:var(--text); font-family:'Nunito',sans-serif; font-size:14px;
  font-weight:700; cursor:pointer; transition:all 0.15s ease; text-align:left;
  display:flex; align-items:flex-start; gap:10px; line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
.opt-letter { width:28px; height:28px; border-radius:9px; background:rgba(232,52,26,0.09); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:var(--muted); flex-shrink:0; font-family:'Barlow Condensed',sans-serif; transition:all 0.15s; }
.opt-text { flex:1; }
.option-btn:hover:not(:disabled) { border-color:rgba(232,52,26,0.5); background:rgba(232,52,26,0.08); transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,0.35); }
.option-btn:active:not(:disabled) { transform:translateY(0) scale(0.98); }
.option-btn.correct { border-color:var(--correct); background:rgba(61,232,160,0.08); }
.option-btn.correct .opt-letter { background:var(--correct); color:#050e1a; }
.option-btn.wrong { border-color:var(--wrong); background:rgba(255,79,110,0.08); }
.option-btn.wrong .opt-letter { background:var(--wrong); color:#050e1a; }
.option-btn:disabled { cursor:default; transform:none !important; }

/* ── Bottom row ── */
.bottom-row { display:flex; gap:8px; margin-top:12px; }
.pass-btn { flex:1; padding:14px; background:transparent; border:2px solid rgba(255,255,255,0.07); border-radius:14px; color:var(--muted); font-family:'Nunito',sans-serif; font-size:14px; font-weight:800; cursor:pointer; transition:all 0.18s ease; display:flex; align-items:center; justify-content:center; gap:6px; }
.pass-btn:hover { border-color:rgba(255,255,255,0.18); color:var(--text); background:rgba(255,255,255,0.04); }
.toggle-btn { flex:1; padding:14px; background:linear-gradient(135deg,rgba(232,52,26,0.18),rgba(232,52,26,0.07)); border:2px solid rgba(232,52,26,0.4); border-radius:14px; color:var(--red-soft); font-family:'Nunito',sans-serif; font-size:14px; font-weight:800; cursor:pointer; transition:all 0.18s ease; display:flex; align-items:center; justify-content:center; gap:6px; }
.toggle-btn:hover { background:rgba(232,52,26,0.28); box-shadow:0 0 20px rgba(232,52,26,0.18); }

/* ── Feedback ── */
.feedback { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.5); font-size:90px; opacity:0; pointer-events:none; transition:all 0.22s cubic-bezier(0.175,0.885,0.32,1.275); z-index:100; filter:drop-shadow(0 0 30px rgba(232,52,26,0.5)); }
.feedback.show { transform:translate(-50%,-50%) scale(1); opacity:1; }
.feedback.hide { transform:translate(-50%,-50%) scale(1.4); opacity:0; transition:all 0.3s ease; }
.no-data { text-align:center; color:var(--muted); font-size:14px; padding:20px 0; }

/* ── Modal ── */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; z-index:999; opacity:0; pointer-events:none; transition:opacity 0.25s ease; }
.modal-overlay.open { opacity:1; pointer-events:all; }
.modal-box { background:var(--card); border-radius:26px; padding:28px 24px; max-width:400px; width:calc(100% - 32px); position:relative; box-shadow:0 30px 80px rgba(0,0,0,0.7); transform:translateY(18px) scale(0.97); transition:transform 0.28s cubic-bezier(0.175,0.885,0.32,1.275); }
.modal-overlay.open .modal-box { transform:translateY(0) scale(1); }
.modal-title { font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:800; text-align:center; margin-bottom:6px; letter-spacing:0.5px; }
.modal-sub { text-align:center; color:var(--muted); font-size:12px; font-weight:700; letter-spacing:0.5px; margin-bottom:20px; text-transform:uppercase; }
.modal-cats { display:flex; flex-direction:column; gap:10px; }
.modal-cat-btn { display:flex; align-items:center; gap:14px; border-radius:16px; padding:14px 16px; cursor:pointer; transition:all 0.18s ease; text-align:left; width:100%; -webkit-tap-highlight-color:transparent; }
.modal-cat-icon { font-size:24px; flex-shrink:0; width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; }
.modal-cat-info { flex:1; }
.modal-cat-name { font-family:'Barlow Condensed',sans-serif; font-size:17px; font-weight:800; letter-spacing:0.3px; line-height:1.2; }
.modal-cat-desc { font-size:12px; color:var(--muted); font-weight:600; margin-top:2px; }
.modal-close { position:absolute; top:16px; right:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); font-size:16px; transition:all 0.15s; }
.modal-close:hover { background:rgba(255,255,255,0.1); color:var(--text); }

/* Kelimeler modal teması */
.modal-box.kelimeler-modal { border:1px solid rgba(232,52,26,0.3); }
.modal-box.kelimeler-modal .modal-title { color:var(--red-soft); }

.kel-easy { background:rgba(232,52,26,0.07); border:2px solid rgba(232,52,26,0.18); }
.kel-easy:hover,.kel-easy.selected { background:rgba(232,52,26,0.18); border-color:var(--red); box-shadow:0 0 16px rgba(232,52,26,0.22); }
.kel-easy .modal-cat-icon { background:rgba(232,52,26,0.12); border:1px solid rgba(232,52,26,0.25); }
.kel-easy .modal-cat-name { color:var(--red-soft); }

.kel-hard { background:rgba(245,166,35,0.07); border:2px solid rgba(245,166,35,0.18); }
.kel-hard:hover,.kel-hard.selected { background:rgba(245,166,35,0.18); border-color:var(--gold); box-shadow:0 0 16px rgba(245,166,35,0.2); }
.kel-hard .modal-cat-icon { background:rgba(245,166,35,0.12); border:1px solid rgba(245,166,35,0.28); }
.kel-hard .modal-cat-name { color:var(--gold-soft); }

@media (max-width:400px) {
  .options { grid-template-columns:1fr; }
  .card { padding:20px 14px 18px; }
  .level-btn { font-size:13px; padding:10px 8px; }
  .goal-panel-top { flex-direction:column; align-items:flex-start; }
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<!-- Header -->
<div class="header">
  <div class="logo-ring">
    <div class="logo-inner">
      <span class="logo-flag">🇪🇸</span>
    </div>
  </div>
  <h1>Spanish <span class="accent">Quiz</span></h1>
  <p>English → Spanish · 4-choice word test · Two-way</p>
</div>

<!-- Level Selector -->
<div class="level-selector">
  <button class="level-btn kelimeler active" id="btnKelimeler" onclick="kelimelerButonTiklandi()">
    📚 Words
  </button>
</div>

<!-- Stats -->
<div class="stats">
  <div class="stat"><div class="stat-num" id="dogruSay">0</div><div class="stat-label">Correct</div></div>
  <div class="stat"><div class="stat-num" id="yanlisSay">0</div><div class="stat-label">Wrong</div></div>
  <div class="stat"><div class="stat-num" id="toplamSay">0</div><div class="stat-label">Total</div></div>
</div>

<!-- Goal Widget -->
<div class="goal-wrap" id="goalWrap">
  <div class="goal-collapsed" id="goalCollapsed" onclick="toggleGoalPanel()">
    <div class="goal-circle-mini">
      <svg width="48" height="48" viewBox="0 0 48 48">
        <circle class="gtrack" cx="24" cy="24" r="20"/>
        <circle class="gfill" id="miniCircleFill" cx="24" cy="24" r="20" stroke-dasharray="125.66" stroke-dashoffset="125.66"/>
      </svg>
      <div class="mini-pct-label" id="miniPctLabel">0%</div>
    </div>
    <div class="goal-info">
      <div class="goal-info-title" id="goalInfoTitle">No Goal Set</div>
      <div class="goal-info-sub" id="goalInfoSub">Set a goal and track your progress</div>
    </div>
    <button class="goal-set-btn" onclick="event.stopPropagation();openGoalPanel()">🎯 Set Goal</button>
  </div>
  <div class="goal-panel" id="goalPanel">
    <div class="goal-panel-top">
      <div class="goal-big-circle">
        <svg width="90" height="90" viewBox="0 0 90 90">
          <circle class="gtrack" cx="45" cy="45" r="38"/>
          <circle class="gfill" id="bigCircleFill" cx="45" cy="45" r="38" stroke-dasharray="238.76" stroke-dashoffset="238.76"/>
        </svg>
        <div class="big-center">
          <div class="big-num" id="bigPctLabel">0%</div>
          <div class="big-sub">done</div>
        </div>
      </div>
      <div class="goal-panel-info">
        <div class="goal-done-txt" id="goalDoneTxt">0 / —</div>
        <div class="goal-done-sub" id="goalDoneSub">Answer correctly to reach your goal</div>
        <div class="goal-presets">
          <button class="goal-preset-btn" onclick="setGoal(10)">10</button>
          <button class="goal-preset-btn" onclick="setGoal(20)">20</button>
          <button class="goal-preset-btn" onclick="setGoal(30)">30</button>
          <button class="goal-preset-btn" onclick="setGoal(50)">50</button>
          <button class="goal-preset-btn" onclick="setGoal(100)">100</button>
        </div>
        <div class="goal-custom-row">
          <input type="number" class="goal-custom-input" id="goalCustomInput" placeholder="Custom number…" min="1" max="9999">
          <button class="goal-apply-btn" onclick="applyCustomGoal()">Apply</button>
        </div>
      </div>
    </div>
    <div id="goalCompleteBanner"></div>
    <button class="goal-close-btn" onclick="toggleGoalPanel()">✕ Close</button>
  </div>
</div>

<!-- Streak -->
<div class="streak-wrap" id="streakWrap"></div>

<!-- Main Card -->
<div class="card">
  <div class="badge-row">
    <div class="dir-badge">
      <div class="dot"></div>
      <span id="directionText">English → Spanish</span>
    </div>
    <div class="lvl-badge kelimeler-a" id="levelBadge">Easy</div>
  </div>
  <div class="question-box" id="questionBox">
    <div class="question-label" id="questionLabel">What is the Spanish word?</div>
    <div class="question-word" id="questionWord">Loading…</div>
    <div class="question-hint" id="questionHint"></div>
  </div>
  <div class="options" id="optionsContainer"></div>
  <div class="bottom-row">
    <button class="pass-btn" onclick="pas()">⏭ Skip</button>
    <button class="toggle-btn" id="toggleBtn" onclick="toggleDirection()">🔄 Switch Direction</button>
  </div>
</div>

<!-- Kelimeler Modal -->
<div class="modal-overlay" id="kelimelerModal">
  <div class="modal-box kelimeler-modal">
    <button class="modal-close" onclick="kapatKelimelerModal()">✕</button>
    <div class="modal-title">📚 Choose Level</div>
    <div class="modal-sub">Select your vocabulary set</div>
    <div class="modal-cats">
      <button class="modal-cat-btn kel-easy" id="btnKelimelerKolay" onclick="secKelimelerSeviye('kelimeA')">
        <div class="modal-cat-icon">⭐</div>
        <div class="modal-cat-info">
          <div class="modal-cat-name">Easy Words</div>
          <div class="modal-cat-desc">Essential everyday vocabulary · A Level</div>
        </div>
      </button>
      <button class="modal-cat-btn kel-hard" id="btnKelimelerOrta" onclick="secKelimelerSeviye('kelimeB')">
        <div class="modal-cat-icon">🔥</div>
        <div class="modal-cat-info">
          <div class="modal-cat-name">Intermediate Words</div>
          <div class="modal-cat-desc">Advanced vocabulary · B Level</div>
        </div>
      </button>
    </div>
  </div>
</div>

<div class="feedback" id="feedbackEmoji"></div>

<script>
var direction = 'en_to_esp';
var activeLevel = 'kelimeA';
var aktifCumle = null;
var dogru = 0, yanlis = 0, toplam = 0;
var streak = 0;
var answered = false;
var goalTarget = 0;

const QUIZ_LEVELS = {
  kelimeA: { label:'Easy',         badge:'kelimeler-a', dir: true },
  kelimeB: { label:'Intermediate', badge:'kelimeler-b', dir: true },
};

/* ═══════ GOAL ═══════ */
const MINI_C = 2*Math.PI*20;
const BIG_C  = 2*Math.PI*38;

function setGoal(n){
  goalTarget = n;
  document.querySelectorAll('.goal-preset-btn').forEach(b=>b.classList.toggle('sel', parseInt(b.textContent)===n));
  updateGoal();
}
function applyCustomGoal(){
  const v = parseInt(document.getElementById('goalCustomInput').value);
  if(v>0&&v<=9999) setGoal(v);
}
function updateGoal(){
  if(goalTarget===0){
    document.getElementById('goalInfoTitle').textContent='No Goal Set';
    document.getElementById('goalInfoSub').textContent='Set a goal and track your progress';
    document.getElementById('goalDoneTxt').textContent='— / —';
    document.getElementById('goalDoneSub').textContent='Tap to set a goal';
    setCircle(0); document.getElementById('goalCompleteBanner').innerHTML=''; return;
  }
  const pct = Math.min(100, Math.round((dogru/goalTarget)*100));
  const done = dogru>=goalTarget;
  document.getElementById('goalInfoTitle').textContent = done?'🎉 Goal Reached!':`Goal: ${goalTarget} Correct`;
  document.getElementById('goalInfoSub').textContent = `${dogru} / ${goalTarget} correct`;
  document.getElementById('goalDoneTxt').textContent = `${dogru} / ${goalTarget}`;
  document.getElementById('goalDoneSub').textContent = done?'You reached your goal! 🏆':'Keep going, you can do it!';
  setCircle(pct);
  document.getElementById('goalCompleteBanner').innerHTML = done
    ? `<div class="goal-complete-banner">🏆 ¡Felicidades! You got ${goalTarget} correct!</div>` : '';
}
function setCircle(pct){
  document.getElementById('miniCircleFill').style.strokeDashoffset = MINI_C-(MINI_C*pct/100);
  document.getElementById('miniPctLabel').textContent = pct+'%';
  document.getElementById('bigCircleFill').style.strokeDashoffset = BIG_C-(BIG_C*pct/100);
  document.getElementById('bigPctLabel').textContent = pct+'%';
}
function toggleGoalPanel(){
  const panel = document.getElementById('goalPanel'), col = document.getElementById('goalCollapsed');
  const isOpen = panel.classList.contains('open');
  panel.classList.toggle('open',!isOpen); col.style.display = isOpen?'flex':'none';
}
function openGoalPanel(){
  document.getElementById('goalPanel').classList.add('open');
  document.getElementById('goalCollapsed').style.display='none';
}

/* ═══════ KELIMELER MODAL ═══════ */
function kelimelerButonTiklandi(){
  document.querySelectorAll('#kelimelerModal .modal-cat-btn').forEach(b=>b.classList.remove('selected'));
  if(activeLevel==='kelimeA') document.getElementById('btnKelimelerKolay').classList.add('selected');
  if(activeLevel==='kelimeB') document.getElementById('btnKelimelerOrta').classList.add('selected');
  document.getElementById('kelimelerModal').classList.add('open');
}
function kapatKelimelerModal(){ document.getElementById('kelimelerModal').classList.remove('open'); }
function secKelimelerSeviye(lvl){
  kapatKelimelerModal();
  setLevel(lvl);
}
document.getElementById('kelimelerModal').addEventListener('click', function(e){ if(e.target===this) kapatKelimelerModal(); });

/* ═══════ SET LEVEL ═══════ */
function setLevel(lvl){
  activeLevel = lvl;
  const cfg = QUIZ_LEVELS[lvl];
  const badge = document.getElementById('levelBadge');
  badge.className = 'lvl-badge ' + cfg.badge;
  badge.textContent = cfg.label;

  const qbox = document.getElementById('questionBox');
  qbox.classList.remove('level-b');
  if(lvl==='kelimeB') qbox.classList.add('level-b');

  document.getElementById('toggleBtn').style.display = cfg.dir ? '' : 'none';
  yeniSoru();
}

/* ═══════ POOL ═══════ */
function getPool(){
  if(activeLevel==='kelimeA') return typeof EspKelimeAListesi!=='undefined'?EspKelimeAListesi:[];
  if(activeLevel==='kelimeB') return typeof EspKelimeBListesi!=='undefined'?EspKelimeBListesi:[];
  return [];
}

/* ═══════ HELPERS ═══════ */
function getRandom(arr, count, exclude){
  const pool = arr.filter(k=>k!==exclude), result=[], used=new Set();
  while(result.length<count && result.length<pool.length){
    const i = Math.floor(Math.random()*pool.length);
    if(!used.has(i)){ used.add(i); result.push(pool[i]); }
  }
  return result;
}
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

function updateStreak(){
  const w = document.getElementById('streakWrap');
  w.innerHTML = streak>=3 ? `<div class="streak-badge">🔥 ${streak} correct in a row!</div>` : '';
}
function showFeedback(e){
  const el = document.getElementById('feedbackEmoji');
  el.textContent=e; el.className='feedback show';
  setTimeout(()=>{ el.className='feedback hide'; setTimeout(()=>el.className='feedback',200); },450);
}

/* ═══════ NEW QUESTION ═══════ */
function yeniSoru(){
  answered = false;
  const pool = getPool();
  const container = document.getElementById('optionsContainer');
  document.getElementById('questionHint').textContent='';

  if(!pool || pool.length<4){
    document.getElementById('questionWord').textContent='—';
    document.getElementById('questionLabel').textContent='Question not found';
    container.innerHTML='<div class="no-data">JS file is missing or empty.</div>'; return;
  }

  aktifCumle = pool[Math.floor(Math.random()*pool.length)];
  const isEnToEsp = direction==='en_to_esp';

  document.getElementById('directionText').textContent = isEnToEsp ? 'English → Spanish' : 'Spanish → English';
  document.getElementById('questionLabel').textContent  = isEnToEsp ? 'What is the Spanish word?' : 'What is the English word?';
  document.getElementById('questionWord').textContent   = isEnToEsp ? aktifCumle.eng : aktifCumle.esp;

  const yanlislar = getRandom(pool, 3, aktifCumle);
  const secenekler = shuffle([aktifCumle, ...yanlislar]);
  const letters = ['A','B','C','D'];
  container.innerHTML = '';
  secenekler.forEach((k,i)=>{
    const text = isEnToEsp ? k.esp : k.eng;
    const btn = document.createElement('button'); btn.className='option-btn';
    const s1 = document.createElement('span'); s1.className='opt-letter'; s1.textContent=letters[i];
    const s2 = document.createElement('span'); s2.className='opt-text'; s2.textContent=text;
    btn.appendChild(s1); btn.appendChild(s2);
    btn.onclick = ()=>secim(btn, k===aktifCumle, isEnToEsp);
    container.appendChild(btn);
  });
}

/* ═══════ SELECTION ═══════ */
function secim(btn, isCorrect, isEnToEsp){
  if(answered) return; answered=true;
  toplam++;
  document.getElementById('toplamSay').textContent=toplam;
  document.querySelectorAll('.option-btn').forEach(b=>b.disabled=true);

  if(isCorrect){
    dogru++; streak++;
    document.getElementById('dogruSay').textContent=dogru;
    btn.classList.add('correct'); showFeedback('✅');
    updateGoal();
  } else {
    yanlis++; streak=0;
    document.getElementById('yanlisSay').textContent=yanlis;
    btn.classList.add('wrong'); showFeedback('❌');
    const dogruTxt = isEnToEsp ? aktifCumle.esp : aktifCumle.eng;
    document.querySelectorAll('.option-btn').forEach(b=>{
      if(b.querySelector('.opt-text').textContent===dogruTxt) b.classList.add('correct');
    });
    document.getElementById('questionHint').textContent = '✦ ' + (isEnToEsp ? aktifCumle.esp : aktifCumle.eng);
  }
  updateStreak();
  setTimeout(yeniSoru, 900);
}

function pas(){ if(!answered) yeniSoru(); }
function toggleDirection(){
  direction = direction==='en_to_esp' ? 'esp_to_en' : 'en_to_esp';
  yeniSoru();
}

/* ═══════ INIT ═══════ */
updateGoal();
</script>

<script src="EsEngKelimeA.js"></script>
<script src="EsEnKelimeB.js"></script>

<script>
yeniSoru();
</script>
</body>
</html>
